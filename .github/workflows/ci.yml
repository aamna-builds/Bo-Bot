name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # tests do not need the images / videos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax, JSON validity, README links, file sizes
        run: python .github/scripts/check_repo.py

  simulation-test:
    name: Simulator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Robot balances, survives a push and drives
        run: python simulation/tools/smoke_test.py simulation/web/index.html

  uno-firmware:
    name: Arduino Uno sketches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.6.0"
      - name: Install the Uno core and U8g2
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install U8g2
      - name: Compile every sketch in firmware/uno for the Uno
        run: |
          fail=0
          while IFS= read -r ino; do
            dir=$(dirname "$ino")
            if out=$(arduino-cli compile --fqbn arduino:avr:uno "$dir" 2>&1); then
              echo "OK    $dir  ($(echo "$out" | grep -o 'Sketch uses [0-9]* bytes ([0-9]*%)'))"
            else
              echo "FAIL  $dir"; echo "$out"; fail=1
            fi
          done < <(find firmware/uno -name '*.ino' | sort)
          exit $fail

  firmware-tests:
    name: Firmware tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Controller and face match the simulator
        working-directory: firmware/test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -o test_controller test_controller.cpp
          g++ -std=c++17 -O2 -Wall -Wextra -o test_face test_face.cpp
          ./test_controller
          ./test_face
      - name: main.cpp syntax check (stand-in Arduino headers)
        working-directory: firmware
        run: |
          for core in 2 3; do
            g++ -std=gnu++17 -fsyntax-only -Wall -Wextra -DESP_ARDUINO_VERSION_MAJOR=$core -Itest/stubs -Ibalance_bot/include balance_bot/src/main.cpp
          done
