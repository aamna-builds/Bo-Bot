<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="940" fill="#ffffff"/>

  <style>
    .t  { font-size: 15px; fill: #111827; }
    .ts { font-size: 12px; fill: #4b5563; }
    .tb { font-size: 17px; font-weight: 600; fill: #111827; }
    .pin { font-size: 13px; fill: #111827; }
    .tag { font-size: 12px; font-weight: 600; }
    .w  { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .dot { stroke: none; }
  </style>

  <text x="40" y="40" class="tb" font-size="22">BO-BOT wiring: Arduino Uno build</text>
  <text x="40" y="64" class="ts">Pins match firmware/uno/bobot_v7/bobot_v7.ino. Line colours follow the real wire colours where they are known.</text>

  <!-- ===================== battery ===================== -->
  <rect x="40" y="90" width="220" height="110" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="150" y="122" text-anchor="middle" class="tb">2S LiPo battery</text>
  <text x="150" y="144" text-anchor="middle" class="ts">7.4 V, 1000 mAh</text>
  <text x="150" y="162" text-anchor="middle" class="ts">XT60 connector</text>
  <text x="250" y="124" text-anchor="end" class="pin">+</text>
  <text x="250" y="174" text-anchor="end" class="pin">−</text>
  <!-- battery + to Uno VIN -->
  <path class="w" stroke="#dc2626" d="M260,120 H430 V290 H480"/>
  <circle class="dot" cx="430" cy="120" r="4.5" fill="#dc2626"/>
  <path class="w" stroke="#dc2626" d="M430,120 V96"/>
  <text x="430" y="88" text-anchor="middle" class="tag" fill="#dc2626">BATT+</text>
  <!-- battery - -->
  <path class="w" stroke="#111827" d="M260,170 H300"/>
  <text x="305" y="174" class="tag" fill="#111827">GND</text>

  <!-- ===================== MPU-6050 ===================== -->
  <rect x="60" y="470" width="200" height="160" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="150" y="497" text-anchor="middle" class="tb">MPU-6050</text>
  <text x="150" y="516" text-anchor="middle" class="ts">gyro + accel, I2C 0x68</text>
  <text x="248" y="544" text-anchor="end" class="pin">VCC</text>
  <text x="248" y="564" text-anchor="end" class="pin">GND</text>
  <text x="248" y="589" text-anchor="end" class="pin">SCL</text>
  <text x="248" y="614" text-anchor="end" class="pin">SDA</text>
  <path class="w" stroke="#dc2626" d="M260,540 H300"/><text x="305" y="544" class="tag" fill="#dc2626">3.3V</text>
  <path class="w" stroke="#111827" d="M260,560 H300"/><text x="305" y="564" class="tag" fill="#111827">GND</text>

  <!-- ===================== OLED ===================== -->
  <rect x="60" y="660" width="200" height="150" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="150" y="687" text-anchor="middle" class="tb">OLED 1.3"</text>
  <text x="150" y="706" text-anchor="middle" class="ts">SH1106, I2C 0x3C</text>
  <text x="248" y="734" text-anchor="end" class="pin">VCC</text>
  <text x="248" y="754" text-anchor="end" class="pin">GND</text>
  <text x="248" y="774" text-anchor="end" class="pin">SDA</text>
  <text x="248" y="794" text-anchor="end" class="pin">SCL</text>
  <path class="w" stroke="#dc2626" d="M260,730 H300"/><text x="305" y="734" class="tag" fill="#dc2626">3.3V</text>
  <path class="w" stroke="#111827" d="M260,750 H300"/><text x="305" y="754" class="tag" fill="#111827">GND</text>

  <!-- ===================== I2C bus ===================== -->
  <!-- SDA lane x=380, SCL lane x=400 -->
  <path class="w" stroke="#2563eb" d="M260,610 H380 V770 H260"/>
  <path class="w" stroke="#7c3aed" d="M260,585 H400 V790 H260"/>
  <!-- Uno A4 (SDA) crosses the SCL lane with a hop -->
  <path class="w" stroke="#2563eb" d="M480,640 H406 A6,6 0 0 0 394,640 H380"/>
  <circle class="dot" cx="380" cy="640" r="4.5" fill="#2563eb"/>
  <path class="w" stroke="#7c3aed" d="M480,690 H400"/>
  <circle class="dot" cx="400" cy="690" r="4.5" fill="#7c3aed"/>
  <text x="372" y="720" text-anchor="end" class="tag" fill="#2563eb">SDA</text>
  <text x="408" y="740" class="tag" fill="#7c3aed">SCL</text>

  <!-- ===================== Arduino Uno ===================== -->
  <rect x="480" y="210" width="280" height="610" rx="10" fill="#e8f0fb" stroke="#1e5aa8" stroke-width="2.5"/>
  <text x="620" y="242" text-anchor="middle" class="tb">Arduino Uno</text>
  <!-- left pins -->
  <text x="492" y="294" class="pin">VIN</text>
  <text x="492" y="354" class="pin">5V</text>
  <text x="492" y="414" class="pin">3.3V</text>
  <text x="492" y="474" class="pin">GND</text>
  <text x="492" y="644" class="pin">A4 (SDA)</text>
  <text x="492" y="694" class="pin">A5 (SCL)</text>
  <path class="w" stroke="#dc2626" d="M480,350 H452"/><text x="446" y="354" text-anchor="end" class="tag" fill="#dc2626">5V</text>
  <path class="w" stroke="#dc2626" d="M480,410 H452"/><text x="446" y="414" text-anchor="end" class="tag" fill="#dc2626">3.3V</text>
  <path class="w" stroke="#111827" d="M480,470 H452"/><text x="446" y="474" text-anchor="end" class="tag" fill="#111827">GND</text>
  <!-- right pins -->
  <text x="748" y="274" text-anchor="end" class="pin">D2</text>
  <text x="748" y="314" text-anchor="end" class="pin">D3</text>
  <text x="748" y="354" text-anchor="end" class="pin">D4</text>
  <text x="748" y="394" text-anchor="end" class="pin">D7</text>
  <text x="748" y="474" text-anchor="end" class="pin">D5 (PWM)</text>
  <text x="748" y="514" text-anchor="end" class="pin">D6 (PWM)</text>
  <text x="748" y="554" text-anchor="end" class="pin">D9 (PWM)</text>
  <text x="748" y="594" text-anchor="end" class="pin">D10 (PWM)</text>
  <text x="748" y="654" text-anchor="end" class="pin">D8</text>
  <text x="748" y="794" text-anchor="end" class="pin">D12</text>
  <text x="620" y="440" text-anchor="middle" class="ts">encoder inputs above,</text>
  <text x="620" y="456" text-anchor="middle" class="ts">driver outputs below</text>

  <!-- ===================== encoders (to the motors) ===================== -->
  <!-- D2: left encoder green (A) -->
  <path class="w" stroke="#16a34a" d="M760,270 H800 V110 H905 V200"/>
  <!-- D3: right encoder green (A), hop over x=905 -->
  <path class="w" stroke="#16a34a" d="M760,310 H820 V125 H899 A6,6 0 0 1 911,125 H1135 V200"/>
  <!-- D4: left encoder yellow (B), hop over x=905 -->
  <path class="w" stroke="#ca8a04" d="M760,350 H840 V140 H899 A6,6 0 0 1 911,140 H935 V200"/>
  <!-- D7: right encoder yellow (B), hops over x=905 and x=935 -->
  <path class="w" stroke="#ca8a04" d="M760,390 H860 V155 H899 A6,6 0 0 1 911,155 H929 A6,6 0 0 1 941,155 H1105 V200"/>

  <!-- ===================== motors ===================== -->
  <rect x="880" y="200" width="160" height="130" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="960" y="250" text-anchor="middle" class="tb">Left motor</text>
  <text x="960" y="268" text-anchor="middle" class="ts">N20 6 V + encoder</text>
  <text x="905" y="216" text-anchor="middle" class="ts">A</text>
  <text x="935" y="216" text-anchor="middle" class="ts">B</text>
  <path class="w" stroke="#111827" d="M990,200 V184"/><text x="990" y="178" text-anchor="middle" class="tag" fill="#111827">5V</text>
  <path class="w" stroke="#2563eb" d="M1020,200 V184"/><text x="1020" y="178" text-anchor="middle" class="tag" fill="#2563eb">GND</text>
  <text x="950" y="318" text-anchor="middle" class="ts">M+</text>
  <text x="990" y="318" text-anchor="middle" class="ts">M−</text>

  <rect x="1080" y="200" width="160" height="130" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="1160" y="250" text-anchor="middle" class="tb">Right motor</text>
  <text x="1160" y="268" text-anchor="middle" class="ts">N20 6 V + encoder</text>
  <text x="1105" y="216" text-anchor="middle" class="ts">B</text>
  <text x="1135" y="216" text-anchor="middle" class="ts">A</text>
  <path class="w" stroke="#111827" d="M1190,200 V184"/><text x="1190" y="178" text-anchor="middle" class="tag" fill="#111827">5V</text>
  <path class="w" stroke="#2563eb" d="M1220,200 V184"/><text x="1220" y="178" text-anchor="middle" class="tag" fill="#2563eb">GND</text>
  <text x="1130" y="318" text-anchor="middle" class="ts">M+</text>
  <text x="1170" y="318" text-anchor="middle" class="ts">M−</text>

  <!-- motor power: red and white wires down to the driver -->
  <path class="w" stroke="#dc2626" d="M950,330 V430"/>
  <path class="w" stroke="#9ca3af" d="M990,330 V430"/>
  <path class="w" stroke="#dc2626" d="M1130,330 V430"/>
  <path class="w" stroke="#9ca3af" d="M1170,330 V430"/>

  <!-- ===================== DRV8833 ===================== -->
  <rect x="920" y="430" width="300" height="330" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="950" y="450" text-anchor="middle" class="pin">OUT1</text>
  <text x="990" y="466" text-anchor="middle" class="pin">OUT2</text>
  <text x="1130" y="450" text-anchor="middle" class="pin">OUT3</text>
  <text x="1170" y="466" text-anchor="middle" class="pin">OUT4</text>
  <text x="932" y="474" class="pin">IN1</text>
  <text x="932" y="514" class="pin">IN2</text>
  <text x="932" y="554" class="pin">IN3</text>
  <text x="932" y="594" class="pin">IN4</text>
  <text x="932" y="654" class="pin">EEP (nSLEEP)</text>
  <text x="1080" y="680" text-anchor="middle" class="tb">DRV8833</text>
  <text x="1080" y="700" text-anchor="middle" class="ts">dual motor driver</text>
  <text x="980" y="748" text-anchor="middle" class="pin">VCC</text>
  <text x="1080" y="748" text-anchor="middle" class="pin">GND</text>
  <path class="w" stroke="#dc2626" d="M980,760 V790"/><text x="980" y="806" text-anchor="middle" class="tag" fill="#dc2626">BATT+</text>
  <path class="w" stroke="#111827" d="M1080,760 V790"/><text x="1080" y="806" text-anchor="middle" class="tag" fill="#111827">GND</text>

  <!-- Uno to driver -->
  <path class="w" stroke="#ea580c" d="M760,470 H920"/>
  <path class="w" stroke="#ea580c" d="M760,510 H920"/>
  <path class="w" stroke="#ea580c" d="M760,550 H920"/>
  <path class="w" stroke="#ea580c" d="M760,590 H920"/>
  <path class="w" stroke="#0d9488" d="M760,650 H920"/>

  <!-- 10k pull-down on EEP -->
  <circle class="dot" cx="860" cy="650" r="4.5" fill="#0d9488"/>
  <path class="w" stroke="#0d9488" d="M860,650 V668"/>
  <rect x="852" y="668" width="16" height="36" rx="2" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="876" y="691" class="ts">10 kΩ</text>
  <path class="w" stroke="#111827" d="M860,704 V720"/>
  <text x="860" y="736" text-anchor="middle" class="tag" fill="#111827">GND</text>

  <!-- push button on D12 -->
  <path class="w" stroke="#475569" d="M760,790 H800"/>
  <circle cx="804" cy="790" r="4" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <circle cx="836" cy="790" r="4" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <path class="w" stroke="#111827" d="M800,776 L840,770"/>
  <path class="w" stroke="#111827" d="M820,773 V762"/>
  <text x="820" y="756" text-anchor="middle" class="ts">push button</text>
  <path class="w" stroke="#111827" d="M840,790 H870"/>
  <text x="875" y="794" class="tag" fill="#111827">GND</text>

  <!-- ===================== legend ===================== -->
  <line x1="40" y1="850" x2="1240" y2="850" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="40" y="876" class="t">Tags with the same name are the same net: every GND is joined together, and BATT+ is the battery + (7.4 V) after the XT60.</text>
  <text x="40" y="898" class="t">A dot is a join. A wire that jumps over another (small arc) is not connected to it. The motor M− wire is white (drawn grey).</text>
  <text x="40" y="920" class="t">Encoder wires per motor: green = A, yellow = B, black = 5V, blue = GND.</text>
</svg>
